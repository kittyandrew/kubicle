# The fixture's Dovecot, shaped like Mailu's: its backend's mailbox settings (core/dovecot/conf/dovecot.conf in
# Mailu's source) and its front proxy's login side (core/nginx/dovecot/proxy.conf): STARTTLS required, PLAIN and
# LOGIN only. fixture.sh mounts this at /fixture/dovecot.conf and the state directory at /state.

log_path = /dev/stderr
protocols = imap
listen = *
default_internal_user = dovecot
default_login_user = mail
default_internal_group = dovecot

mail_location = maildir:/state/mail/%u
mail_home = /state/mail/%u
mail_uid = mail
mail_gid = mail
first_valid_uid = 8
first_valid_gid = 8
maildir_stat_dirs = yes
# Mailu sets the first; the owner's Mailu override adds the second, so STATUS of every folder reads one index,
# INBOX included (without it, STATUS of a 50,000-message INBOX that is not selected costs 24 ms).
mailbox_list_index = yes
mailbox_list_index_include_inbox = yes
mail_plugins = $mail_plugins fts fts_flatcurve

# No separator line, as in Mailu: Maildir++ then uses ".", so category folders read INBOX.github.
namespace inbox {
  inbox = yes
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  # The owner's Mailu override adds Archive; Mailu ships the four above.
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# As Mailu's: no auth penalty (anvil's listener closed), since every login comes through front. With it, every
# login after a failed one from the same address waited seconds.
service anvil {
  unix_listener anvil-auth-penalty {
    mode = 0
  }
}

plugin {
  fts = flatcurve
  fts_languages = en
  fts_tokenizers = generic email-address
  fts_autoindex = yes
  fts_enforced = yes
  fts_autoindex_exclude = \Trash
  fts_autoindex_exclude1 = \Junk
  fts_filters = normalizer-icu lowercase snowball stopwords
  fts_filters_en = normalizer-icu lowercase snowball english-possessive stopwords
}

auth_mechanisms = plain login
ssl = required
ssl_cert = </state/tls/server.pem
ssl_key = </state/tls/server.key
ssl_min_protocol = TLSv1.2

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /fixture/users
}
userdb {
  driver = static
  args = uid=mail gid=mail
}

protocol imap {
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 29mins
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service indexer-worker {
  process_limit = 1
}
